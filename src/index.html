<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="error-message-container"></div>
    <div class="main-container">
        <!-- Login -->
         <div class="card" style="width: 25rem;">
            <div class="card-body">
                <h5 class="card-title">Login</h5>
                <form id="login_form">
                    <div class="mb-3">
                        <label for="email_input" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email_input" aria-describedby="emailHelp">
                    </div>
                    <div class="mb-3">
                        <label for="pass_input" class="form-label">Password</label>
                        <input type="password" class="form-control" id="pass_input">
                    </div>
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </form>
                <a class="card-text" href="">¿Ha olvidado la contraseña?</a>
                <a class="card-text" href="">¿No tiene una cuenta?</a>
            </div>
        </div>
    </div>
    <script type="module" src="script/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
